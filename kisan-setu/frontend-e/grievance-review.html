<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kisan Setu — Grievance Review Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --green: #2C5F2D; --border: #D8DEDA; --amber: #B5651D; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; margin: 0; padding: 24px; }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 20px; color: var(--green); margin: 0 0 16px; }
  .card { background: white; border: 1px solid var(--border); border-radius: 10px;
          padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card .left { flex: 1; }
  .meta { font-size: 12px; color: #888; margin-top: 4px; }
  .reason { font-weight: 600; font-size: 14px; }
  .id { font-size: 11px; color: #aaa; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.open { background: #FBEAE8; color: #A6362C; }
  .badge.resolved { background: #E7F4EA; color: #2C7A3D; }
  button { padding: 8px 14px; border: 1px solid var(--green); background: white; color: var(--green);
          border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
  button:hover { background: var(--green); color: white; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .empty { color: #999; text-align: center; padding: 40px; }
  a.photo { font-size: 12px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Grievance Review Queue</h1>
  <div id="list"><p class="empty">Loading…</p></div>
</div>

<script>
  const API_BASE = "http://localhost:4000/api";
  const listEl = document.getElementById("list");

  async function loadGrievances() {
    listEl.innerHTML = "<p class='empty'>Loading…</p>";
    try {
      const res = await fetch(`${API_BASE}/grievances`);
      const data = await res.json();
      if (!data.length) {
        listEl.innerHTML = "<p class='empty'>No grievances yet. Submit one via grievance-widget.html to see it here.</p>";
        return;
      }
      listEl.innerHTML = data
        .slice()
        .reverse()
        .map((g) => `
          <div class="card">
            <div class="left">
              <div class="reason">${g.reason}</div>
              <div class="meta">
                Booking ${g.bookingId} · Farmer ${g.farmerId} ·
                <span class="badge ${g.status.toLowerCase()}">${g.status}</span>
                ${g.photoUrl ? `· <a class="photo" href="${g.photoUrl}" target="_blank">view photo</a>` : ""}
              </div>
              <div class="id">${g.grievanceId} · logged ${new Date(g.loggedAt).toLocaleString()}</div>
            </div>
            <button ${g.status === "Resolved" ? "disabled" : ""} onclick="resolve('${g.grievanceId}')">
              ${g.status === "Resolved" ? "Resolved" : "Mark Resolved"}
            </button>
          </div>
        `)
        .join("");
    } catch (err) {
      listEl.innerHTML = `<p class="empty">Couldn't load — is the backend running? (${err.message})</p>`;
    }
  }

  async function resolve(id) {
    await fetch(`${API_BASE}/grievances/${id}/resolve`, { method: "POST" });
    loadGrievances();
  }
  window.resolve = resolve;

  loadGrievances();
  setInterval(loadGrievances, 5000); // simple live-refresh for the demo
</script>

</body>
</html>
