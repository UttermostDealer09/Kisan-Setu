<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Village Agent Portal - Kisan Setu</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; }
        button:hover { background: #1b5e20; }
        #result { margin-top: 20px; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>

    <h2>Village Agent Booking Portal</h2>
    <form id="agentBookingForm">
        <div class="form-group">
            <label for="farmerName">Farmer Name:</label>
            <input type="text" id="farmerName" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" required>
        </div>
        <div class="form-group">
            <label for="cropType">Crop Type:</label>
            <input type="text" id="cropType" required>
        </div>
        <div class="form-group">
            <label for="expectedWeight">Expected Weight (kg):</label>
            <input type="number" id="expectedWeight" required>
        </div>
        <button type="submit">Book Slot & Generate Token</button>
    </form>

    <div id="result"></div>

    <!-- Import the shared API client -->
    <script type="module">
        import { api } from "../frontend-shared/apiClient.js";

        document.getElementById('agentBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                farmerName: document.getElementById('farmerName').value,
                phone: document.getElementById('phone').value,
                cropType: document.getElementById('cropType').value,
                expectedWeight: Number(document.getElementById('expectedWeight').value)
            };

            try {
                const result = await api.bookAgent(payload);
                document.getElementById('result').innerText = 
                    `Booking Confirmed! Token Number: ${result.data.tokenNumber}`;
            } catch (err) {
                alert(`Failed: ${err.message}`);
            }
        });
    </script>
</body>
</html>
